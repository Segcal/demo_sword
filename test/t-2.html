<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complete Your Offline Payment Modal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-900 min-h-screen flex items-center justify-center p-4">

  <!-- Background Overlay / Modal Container -->
  <div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
    
    <!-- Modal Card -->
    <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl p-6 sm:p-10 relative my-8 text-gray-800">
      
      <!-- Back Button -->
      <button 
        type="button" 
        class="inline-flex items-center gap-1 text-xs font-semibold text-orange-500 border border-orange-200 bg-orange-50/50 hover:bg-orange-100 px-3.5 py-1.5 rounded-full transition-colors mb-6">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Return
      </button>

      <!-- Main Heading -->
      <div class="text-center mb-8">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-orange-400 tracking-tight">
          Complete Your Offline Payment
        </h1>
      </div>

      <!-- Section 1: Audition PIN Summary Box -->
      <div class="bg-amber-50/40 border border-amber-100 p-5 rounded-2xl mb-6">
        <h3 class="text-sm font-bold text-gray-800 mb-3">Audition PIN</h3>
        
        <!-- Inner Selected Package Card -->
        <div class="bg-amber-50/60 border border-amber-200/60 p-5 rounded-xl">
          <span class="text-[10px] font-bold tracking-wider uppercase text-amber-500">STARTER</span>
          <div class="text-2xl font-bold text-gray-900 mt-1">₦3,000</div>
          <p class="text-xs text-gray-500 mt-2">3 audition attempts</p>
          <p class="text-[11px] text-gray-400 mt-1">₦1000 per attempt</p>
        </div>
      </div>

      <!-- Section 2: Account Details Box -->
      <div class="bg-amber-50/40 border border-amber-100 p-5 rounded-2xl mb-8 space-y-4">
        <h3 class="text-sm font-bold text-gray-800 mb-4">Account Details</h3>

        <!-- Bank & Account Number Row -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Bank Name -->
          <div>
            <span class="block text-xs text-gray-500 mb-1">Bank:</span>
            <div class="flex items-center gap-2">
              <span class="text-sm sm:text-base font-bold text-gray-900">Fidelity bank</span>
              <button 
                type="button" 
                onclick="copyText('Fidelity bank', this)"
                class="text-gray-400 hover:text-gray-600 transition-colors p-0.5" 
                title="Copy Bank Name">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Account Number -->
          <div>
            <span class="block text-xs text-gray-500 mb-1">Account Number:</span>
            <div class="flex items-center gap-2">
              <span class="text-sm sm:text-base font-bold text-gray-900">4010959630</span>
              <button 
                type="button" 
                onclick="copyText('4010959630', this)"
                class="text-gray-400 hover:text-gray-600 transition-colors p-0.5" 
                title="Copy Account Number">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Account Name Row -->
        <div class="pt-2">
          <span class="block text-xs text-gray-500 mb-1">Account Name:</span>
          <div class="flex items-center gap-2">
            <span class="text-sm sm:text-base font-bold text-gray-900">Machibes Technology Limited</span>
            <button 
              type="button" 
              onclick="copyText('Machibes Technology Limited', this)"
              class="text-gray-400 hover:text-gray-600 transition-colors p-0.5" 
              title="Copy Account Name">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
              </svg>
            </button>
          </div>
        </div>

      </div>

      <!-- Action Button Center Aligned -->
      <div class="flex justify-center pt-2">
        <button 
          type="button" 
          id="madePaymentBtn"
          class="px-8 py-3 bg-orange-500 hover:bg-orange-600 text-white text-xs font-semibold rounded-full shadow-lg shadow-orange-500/20 transition-all transform active:scale-95">
          I Have Made Payment
        </button>
      </div>

    </div>
  </div>

  <!-- JavaScript Interactivity -->
  <script>
    // Copy to clipboard function with temporary feedback
    function copyText(text, btnElement) {
      navigator.clipboard.writeText(text).then(() => {
        const originalHTML = btnElement.innerHTML;
        btnElement.innerHTML = `
          <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
        `;
        setTimeout(() => {
          btnElement.innerHTML = originalHTML;
        }, 1500);
      });
    }

    // Confirmation Action
    document.getElementById('madePaymentBtn').addEventListener('click', function() {
      alert('Payment submitted for verification!');
    });
  </script>
</body>
</html>
