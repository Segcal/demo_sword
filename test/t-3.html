<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HFGS Audition - Game</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between p-4 sm:p-8 font-sans select-none">

  <!-- Header -->
  <header class="w-full max-w-5xl mx-auto flex items-center justify-between">
    <a href="#" class="inline-flex items-center text-gray-300 hover:text-white transition-colors text-sm font-medium gap-2">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      <span>Back to Home</span>
    </a>

    <button class="inline-flex items-center gap-2 bg-[#1A120B] border border-[#3D2514] text-[#E08535] hover:bg-[#25190F] hover:text-[#F59E0B] px-4 py-2 rounded-full text-xs sm:text-sm font-medium transition-all">
      <i data-lucide="shield" class="w-4 h-4 text-[#E08535]"></i>
      <span>View Leaderboard</span>
    </button>
  </header>

  <!-- Main Game Layout -->
  <main class="flex-1 flex flex-col items-center justify-center py-6 w-full max-w-4xl mx-auto">
    
    <!-- Status Badges: Timer & Score -->
    <div class="flex items-center justify-center gap-4 mb-6 w-full">
      <!-- Timer -->
      <div class="bg-[#411C06] border border-[#692E09] text-white px-6 py-2.5 rounded-full flex items-center gap-3 shadow-lg">
        <i data-lucide="clock" class="w-5 h-5 text-[#F59E0B]"></i>
        <span id="timer" class="text-xl font-bold tracking-wider">05:00</span>
      </div>

      <!-- Score -->
      <div class="bg-[#120B06] border border-[#D97706]/40 text-white px-6 py-2.5 rounded-full flex items-center gap-2 shadow-lg">
        <i data-lucide="database" class="w-5 h-5 text-[#F59E0B]"></i>
        <span class="text-xl font-bold"><span id="score">0</span><span class="text-gray-400 font-normal text-sm"> / 10 points</span></span>
      </div>
    </div>

    <!-- Question Info Card -->
    <div class="w-full bg-[#120B06] border border-[#2A1D13] rounded-2xl px-6 py-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 mb-4">
      <h2 id="questionNum" class="text-lg sm:text-xl font-bold text-white">Question 1</h2>
      <p class="text-xs sm:text-sm text-gray-400">Arrange the fragments into a correct sentence</p>
    </div>

    <!-- Playground Card -->
    <div class="w-full bg-[#120B06] border border-[#2A1D13] rounded-3xl p-5 sm:p-8 flex flex-col justify-between min-h-[380px] shadow-2xl relative">
      
      <div>
        <!-- Section: Your Arrangement -->
        <div class="mb-6">
          <p class="text-[11px] sm:text-xs font-semibold text-gray-400 tracking-wider uppercase mb-3">
            YOUR ARRANGEMENT — <span class="text-gray-500 font-normal">TAP A TILE TO REMOVE IT</span>
          </p>

          <!-- Dropzone Container -->
          <div id="arrangedZone" class="w-full min-h-[72px] bg-[#18100A] border border-dashed border-[#3D2919] rounded-2xl p-3 flex flex-wrap items-center gap-2 transition-all">
            <!-- Dynamically populated or showing placeholder -->
            <span id="placeholderText" class="text-xs sm:text-sm text-gray-600 px-2">Tap fragments below to arrange them here...</span>
          </div>
        </div>

        <!-- Section: Available Fragments -->
        <div>
          <p class="text-[11px] sm:text-xs font-semibold text-gray-400 tracking-wider uppercase mb-3">
            AVAILABLE FRAGMENTS — <span class="text-gray-500 font-normal">TAP TO PLACE</span>
          </p>

          <!-- Available Tiles Container -->
          <div id="availableZone" class="flex flex-wrap items-center gap-3 min-h-[48px]">
            <!-- Dynamically populated fragments -->
          </div>
        </div>
      </div>

      <!-- Action Footer -->
      <div class="flex justify-end mt-8">
        <button 
          id="nextBtn"
          disabled
          onclick="submitAnswer()"
          class="bg-[#2D170B] text-gray-500 font-medium py-3.5 px-8 rounded-2xl transition-all duration-200 text-sm sm:text-base cursor-not-allowed border border-[#3D2110]"
        >
          Next Question
        </button>
      </div>

    </div>
  </main>

  <footer class="w-full max-w-5xl mx-auto opacity-0 pointer-events-none">
    <span class="text-xs">Footer</span>
  </footer>

  <!-- Game Logic JavaScript -->
  <script>
    // --- QUESTIONS DATA BANK (JSON) ---
    const questionsData = [
      {
        id: 1,
        originalOrder: [
          "A peaceful mother",
          "prays for the well-being",
          "of the children",
          "without ceasing"
        ]
      },
      {
        id: 2,
        originalOrder: [
          "children who are taught",
          "good values at home",
          "carry those lessons",
          "throughout their lives"
        ]
      },
      {
        id: 3,
        originalOrder: [
          "Strong families build",
          "resilient communities through",
          "love and mutual respect",
          "every single day"
        ]
      }
    ];

    // --- GAME STATE ---
    let currentQuestionIdx = 0;
    let score = 0;
    let availableFragments = [];
    let arrangedFragments = [];
    let timeRemaining = 300; // 5 minutes (300 seconds)
    let timerInterval = null;

    // --- INITIALIZATION ---
    window.onload = () => {
      lucide.createIcons();
      startTimer();
      loadQuestion(currentQuestionIdx);
    };

    // --- TIMER LOGIC ---
    function startTimer() {
      const timerEl = document.getElementById('timer');
      timerInterval = setInterval(() => {
        timeRemaining--;
        
        const minutes = Math.floor(timeRemaining / 60);
        const seconds = timeRemaining % 60;
        timerEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          alert(`Time is up! Final Score: ${score}/10`);
          // Handle flow end / redirection
        }
      }, 1000);
    }

    // --- GAME LOGIC & RENDERING ---
    function loadQuestion(index) {
      if (index >= questionsData.length) {
        clearInterval(timerInterval);
        alert(`Congratulations! Quiz finished. Score: ${score}/10`);
        return;
      }

      document.getElementById('questionNum').textContent = `Question ${index + 1}`;
      
      const currentQ = questionsData[index];
      // Create shuffled copy for options
      availableFragments = [...currentQ.originalOrder].sort(() => Math.random() - 0.5);
      arrangedFragments = [];

      renderTiles();
    }

    function renderTiles() {
      const availableZone = document.getElementById('availableZone');
      const arrangedZone = document.getElementById('arrangedZone');
      const placeholderText = document.getElementById('placeholderText');
      const nextBtn = document.getElementById('nextBtn');

      // Clear contents
      availableZone.innerHTML = '';
      arrangedZone.innerHTML = '';

      // Render Arranged Area
      if (arrangedFragments.length === 0) {
        arrangedZone.appendChild(placeholderText);
        placeholderText.style.display = 'block';
      } else {
        placeholderText.style.display = 'none';
        arrangedFragments.forEach((text, idx) => {
          const tile = document.createElement('button');
          tile.className = "bg-[#2A170B] border border-[#F59E0B]/50 hover:border-[#F59E0B] text-[#F3EBE6] px-3.5 py-2.5 rounded-xl text-xs sm:text-sm flex items-center gap-2 transition-all active:scale-95 shadow-md";
          tile.innerHTML = `
            <span class="text-[#F59E0B] font-medium">${idx + 1}.</span>
            <span>${text}</span>
            <i data-lucide="x" class="w-3.5 h-3.5 text-gray-400 hover:text-white"></i>
          `;
          tile.onclick = () => removeFragment(idx);
          arrangedZone.appendChild(tile);
        });
      }

      // Render Available Area
      if (availableFragments.length === 0) {
        availableZone.innerHTML = `<span class="text-xs sm:text-sm text-gray-500 italic">All fragments placed. Submit when ready.</span>`;
      } else {
        availableFragments.forEach((text, idx) => {
          const tile = document.createElement('button');
          tile.className = "bg-[#1A120B] border border-[#2D2016] hover:border-[#D97706]/60 text-gray-200 hover:text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm transition-all active:scale-95 shadow-sm";
          tile.textContent = text;
          tile.onclick = () => selectFragment(idx);
          availableZone.appendChild(tile);
        });
      }

      // Refresh Icons inside newly injected HTML
      lucide.createIcons();

      // Enable/Disable "Next Question" Button
      if (availableFragments.length === 0 && arrangedFragments.length > 0) {
        nextBtn.disabled = false;
        nextBtn.className = "bg-[#52250A] hover:bg-[#682E0B] text-[#F3EBE6] font-medium py-3.5 px-8 rounded-2xl transition-all duration-200 text-sm sm:text-base cursor-pointer shadow-lg hover:shadow-[#52250A]/20 active:scale-[0.99] border border-[#7C3A10]";
      } else {
        nextBtn.disabled = true;
        nextBtn.className = "bg-[#2D170B] text-gray-500 font-medium py-3.5 px-8 rounded-2xl transition-all duration-200 text-sm sm:text-base cursor-not-allowed border border-[#3D2110]";
      }
    }

    function selectFragment(idx) {
      const fragment = availableFragments.splice(idx, 1)[0];
      arrangedFragments.push(fragment);
      renderTiles();
    }

    function removeFragment(idx) {
      const fragment = arrangedFragments.splice(idx, 1)[0];
      availableFragments.push(fragment);
      renderTiles();
    }

    function submitAnswer() {
      const currentQ = questionsData[currentQuestionIdx];
      const isCorrect = JSON.stringify(arrangedFragments) === JSON.stringify(currentQ.originalOrder);

      if (isCorrect) {
        score++;
        document.getElementById('score').textContent = score;
      }

      currentQuestionIdx++;
      loadQuestion(currentQuestionIdx);
    }
  </script>
</body>
</html>
