<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prizes Section</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<div class="bg-neutral-950 text-white font-sans min-h-screen flex items-center justify-center p-4 md:p-8">

  <div class="max-w-6xl w-full mx-auto space-y-16">
    
    <section class="text-center">
      <h2 class="text-3xl md:text-5xl font-extrabold text-amber-500 tracking-wide mb-10 drop-shadow-md">
        Grand Prize
      </h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 lg:gap-8">
        
        <div class="group relative bg-gradient-to-b from-amber-950/40 to-neutral-900 border border-amber-900/50 rounded-2xl p-6 overflow-hidden transition-all duration-300 hover:scale-[1.03] hover:border-amber-500/50 flex flex-col justify-between min-h-[380px] shadow-xl">
          <div class="absolute top-4 left-1/2 -translate-x-1/2 w-8 h-8 rounded-full bg-amber-500 flex items-center justify-center shadow-lg border border-amber-300">
            <span class="text-xs text-neutral-950">🏆</span>
          </div>
          <div class="mt-8 flex-grow flex items-center justify-center">
            <img src="https://via.placeholder.com/250x250/301505/FFFFFF?text=Medal+Placeholder" alt="Bible Personality Medal" class="max-h-52 object-contain rounded-xl">
          </div>
          <h3 class="text-lg font-black tracking-wider uppercase text-white mt-4">
            Bible Personality <br> <span class="text-amber-400">Of The Year</span>
          </h3>
        </div>

        <div class="group relative bg-gradient-to-b from-amber-900/60 to-neutral-900 border-2 border-amber-500/80 rounded-2xl p-6 overflow-hidden transition-all duration-300 hover:scale-[1.03] flex flex-col justify-between min-h-[380px] shadow-2xl shadow-amber-950/50">
          <div class="absolute top-4 left-1/2 -translate-x-1/2 w-8 h-8 rounded-full bg-amber-500 flex items-center justify-center shadow-lg border border-amber-300">
            <span class="text-xs text-neutral-950">👑</span>
          </div>
          <div class="mt-8 flex-grow flex items-center justify-center">
            <img src="https://via.placeholder.com/300x180/402005/FFFFFF?text=White+SUV+Placeholder" alt="Brand New SUV" class="max-h-52 object-contain drop-shadow-[0_10px_20px_rgba(0,0,0,0.6)]">
          </div>
          <h3 class="text-xl font-black tracking-wider uppercase text-amber-400 mt-4">
            Brand New SUV
          </h3>
        </div>

        <div class="group relative bg-gradient-to-b from-amber-950/40 to-neutral-900 border border-amber-900/50 rounded-2xl p-6 overflow-hidden transition-all duration-300 hover:scale-[1.03] hover:border-amber-500/50 flex flex-col justify-between min-h-[380px] shadow-xl">
          <div class="absolute top-4 left-1/2 -translate-x-1/2 w-8 h-8 rounded-full bg-amber-500 flex items-center justify-center shadow-lg border border-amber-300">
            <span class="text-xs text-neutral-950">✨</span>
          </div>
          <div class="mt-8 flex-grow flex items-center justify-center">
            <img src="https://via.placeholder.com/250x200/301505/FFFFFF?text=Cash+Stack+Placeholder" alt="Cash Prize" class="max-h-52 object-contain">
          </div>
          <h3 class="text-xl font-black tracking-wider uppercase text-white mt-4">
            N10 Million <br> <span class="text-amber-400">Cash Prize</span>
          </h3>
        </div>

      </div>
    </section>

    <section class="text-center">
      <h2 class="text-3xl md:text-5xl font-extrabold text-amber-500/90 tracking-wide mb-10 drop-shadow-md">
        Other Prizes
      </h2>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 lg:gap-8">
        
        <div class="group bg-gradient-to-b from-indigo-950/60 to-neutral-900 border border-indigo-900/50 rounded-2xl p-6 transition-all duration-300 hover:scale-[1.02] hover:border-indigo-500/40 flex flex-col justify-between min-h-[320px] shadow-lg">
          <div class="flex-grow flex items-center justify-center">
            <img src="https://via.placeholder.com/220x180/201040/FFFFFF?text=Cash+Gift+Box" alt="1st Runner Up Prize" class="max-h-44 object-contain">
          </div>
          <h4 class="text-lg font-black tracking-wider uppercase text-indigo-300 mt-4">
            1st Runner Up
          </h4>
        </div>

        <div class="group bg-gradient-to-b from-amber-950/40 to-neutral-900 border border-amber-900/40 rounded-2xl p-6 transition-all duration-300 hover:scale-[1.02] hover:border-amber-500/40 flex flex-col justify-between min-h-[320px] shadow-lg">
          <div class="flex-grow flex items-center justify-center">
            <img src="https://via.placeholder.com/220x180/301505/FFFFFF?text=Cash+Pile" alt="2nd Runner Up Prize" class="max-h-44 object-contain">
          </div>
          <h4 class="text-lg font-black tracking-wider uppercase text-amber-400 mt-4">
            2nd Runner Up
          </h4>
        </div>

        <div class="group bg-gradient-to-b from-rose-950/40 to-neutral-900 border border-rose-900/40 rounded-2xl p-6 transition-all duration-300 hover:scale-[1.02] hover:border-rose-500/40 flex flex-col justify-between min-h-[320px] shadow-lg sm:col-span-2 md:col-span-1">
          <div class="flex-grow flex items-center justify-center">
            <img src="https://via.placeholder.com/220x180/401015/FFFFFF?text=Smaller+Cash+Pile" alt="Other Housemates Prize" class="max-h-44 object-contain">
          </div>
          <h4 class="text-lg font-black tracking-wider uppercase text-rose-400 mt-4">
            Other Housemates
          </h4>
        </div>

      </div>
    </section>

  </div>

</div>
</html>
