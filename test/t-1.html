<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HFGS Audition Platform</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between p-6 sm:p-12 font-sans relative">

  <!-- Top Navigation -->
  <header class="w-full max-w-7xl mx-auto">
    <a href="#" class="inline-flex items-center text-gray-300 hover:text-white transition-colors text-sm font-medium gap-2">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      <span>Back to Home</span>
    </a>
  </header>

  <!-- Main Content Container (Centered Card) -->
  <main class="flex-1 flex items-center justify-center py-8">
    <div class="w-full max-w-[480px] bg-[#120B06] border border-[#2A1D13] rounded-3xl p-8 sm:p-10 flex flex-col items-center text-center shadow-2xl">
      
      <!-- Logo Circle -->
      <div class="w-20 h-20 rounded-full overflow-hidden border-2 border-[#D97706]/20 mb-6 flex items-center justify-center bg-[#1A120B] shadow-inner">
        <img 
          src="https://res.cloudinary.com/dtrqikle5/image/upload/v1786658239/f7ef6f0c33c18c9e0510a26e904a8e699b8fc3f0_nknamg.png" 
          alt="The Happy Family Game Show Logo" 
          class="w-full h-full object-cover"
        />
      </div>

      <!-- Main Heading -->
      <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-white mb-2 leading-tight">
        Welcome to the<br />
        <span class="text-[#F59E0B]">HFGS audition platform.</span>
      </h1>

      <!-- Subtitle/Info -->
      <p class="text-gray-400 text-xs sm:text-sm font-normal mb-8">
        5 minutes • Reach 10 points to stand a chance for selection.
      </p>

      <!-- Form Container -->
      <form id="auditionForm" class="w-full flex flex-col gap-4" onsubmit="handleFormSubmit(event)">
        <!-- Input Field -->
        <div class="relative w-full">
          <input 
            type="text" 
            id="auditionPin"
            placeholder="Enter your Audition PIN" 
            required
            class="w-full bg-[#1A130D] border border-[#2D2118] text-white placeholder-gray-500 rounded-xl px-4 py-3.5 text-sm sm:text-base focus:outline-none focus:border-[#F59E0B] focus:ring-1 focus:ring-[#F59E0B] transition-all text-center tracking-wide"
          />
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="w-full bg-[#52250A] hover:bg-[#682E0B] text-[#F3EBE6] font-medium py-3.5 px-6 rounded-xl transition-all duration-200 text-sm sm:text-base shadow-lg hover:shadow-[#52250A]/20 active:scale-[0.99]"
        >
          Access Platform
        </button>
      </form>

      <!-- Get PIN Action Link -->
      <div class="mt-8">
        <a 
          href="#" 
          class="text-[#F59E0B] hover:text-[#FBBF24] text-xs sm:text-sm font-medium underline underline-offset-4 decoration-[#F59E0B]/50 hover:decoration-[#FBBF24] transition-all"
        >
          Get Audition PIN — from ₦3,000
        </a>
      </div>

    </div>
  </main>

  <!-- Empty Footer placeholder for vertical alignment -->
  <footer class="w-full max-w-7xl mx-auto opacity-0 pointer-events-none">
    <span class="text-xs">Footer</span>
  </footer>

  <!-- JavaScript -->
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Form Handling Example
    function handleFormSubmit(event) {
      event.preventDefault();
      const pinInput = document.getElementById('auditionPin').value;
      
      if (pinInput.trim()) {
        console.log('Submitted PIN:', pinInput);
        // Add flow transition logic here for next steps
      }
    }
  </script>
</body>
</html>
