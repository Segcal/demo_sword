<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IYMF Most Intelligent Award</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen font-sans flex flex-col justify-center items-center relative p-4">

  <button class="absolute top-6 left-6 flex items-center text-gray-400 hover:text-white transition duration-200 text-sm font-medium">
    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
    </svg>
    Back to Home
  </button>

  <div class="w-full max-w-md bg-[#1d120a] border border-[#2d1b0f] rounded-3xl p-8 md:p-12 text-center shadow-2xl flex flex-col items-center">
    
    <div class="w-16 h-16 bg-[#3d2212] border-2 border-[#cc6a1d] rounded-full flex items-center justify-center mb-6">
      <svg class="w-7 h-7 text-[#ff8324]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path>
      </svg>
    </div>

    <h1 class="text-2xl md:text-3xl font-semibold tracking-wide text-white mb-2">
      Welcome to the Race for
    </h1>
    <h2 class="text-2xl md:text-3xl font-bold text-[#f59e0b] tracking-wide mb-8">
      IYMF Most Intelligent Award
    </h2>

    <form class="w-full space-y-5">
      
      <div class="relative flex items-center">
        <span class="absolute left-4 text-gray-500">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
        </span>
        <input 
          type="text" 
          placeholder="Enter your PIN or Subscription ID" 
          class="w-full bg-[#170e08] border border-[#3d2212] rounded-xl py-3.5 pl-12 pr-4 text-sm text-gray-200 placeholder-gray-600 focus:outline-none focus:border-[#ff8324] transition duration-200"
        />
      </div>

      <button 
        type="submit" 
        class="w-full bg-[#5c2e14] border border-[#85421c] text-white font-medium rounded-full py-3 hover:bg-[#6e3718] active:scale-[0.99] transition-all duration-200"
      >
        Access Platform
      </button>
    </form>

    <a href="#" class="mt-6 text-sm font-medium text-[#ff8324] hover:text-[#ffa45c] underline underline-offset-4 transition duration-200">
      Get PIN / Subscribe Now
    </a>

  </div>

</body>
</html>
