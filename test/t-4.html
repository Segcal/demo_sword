<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Submitted - IYMF</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen font-sans flex flex-col justify-center items-center relative p-4 select-none">

  <div class="absolute top-6 left-6 right-6 flex justify-between items-center z-10">
    <button class="flex items-center text-gray-400 hover:text-white transition duration-200 text-sm font-medium">
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
      Back to Home
    </button>

    <button class="flex items-center bg-[#25140b] border border-[#402313] hover:bg-[#341d10] text-gray-300 hover:text-white px-4 py-2 rounded-full transition duration-200 text-sm font-medium">
      <svg class="w-4 h-4 mr-2 text-[#ca6b24]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path>
      </svg>
      View Rankings
    </button>
  </div>

  <div class="w-full max-w-md bg-[#130b06] border border-[#23150c] rounded-3xl p-8 md:p-10 text-center shadow-2xl flex flex-col items-center relative mt-12 md:mt-0">
    
    <button class="absolute top-6 right-6 text-gray-500 hover:text-gray-300 transition duration-150">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>

    <div class="w-16 h-16 bg-[#3d2212] border-2 border-[#cc6a1d] rounded-full flex items-center justify-center mb-6">
      <svg class="w-8 h-8 text-[#ff8324]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>

    <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white mb-4">
      Quiz Submitted!
    </h1>
    <p class="text-gray-400 text-sm leading-relaxed mb-8 max-w-[280px] mx-auto">
      Your answers have been submitted and have been evaluated.
    </p>

    <div class="w-full bg-[#1b1008] border border-[#26170d] rounded-2xl p-5 mb-8 space-y-4 text-left">
      
      <div class="flex justify-between items-center">
        <div class="flex items-center text-gray-400 text-sm">
          <svg class="w-4 h-4 mr-2 text-[#ca6b24]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Time Taken:
        </div>
        <span class="text-sm font-semibold text-white">314 seconds</span>
      </div>

      <div class="flex justify-between items-center">
        <div class="flex items-center text-gray-400 text-sm">
          <svg class="w-4 h-4 mr-2 text-[#ca6b24]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path>
          </svg>
          Status:
        </div>
        <span class="text-sm font-bold text-[#ca6b24]">3rd</span>
      </div>

    </div>

    <button class="w-full py-3 bg-[#5c2e14] border border-[#85421c] text-white text-sm font-medium rounded-full hover:bg-[#6e3718] active:scale-[0.99] transition-all duration-200">
      View Leaderboard
    </button>

  </div>

</body>
</html>
