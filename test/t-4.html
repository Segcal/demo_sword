<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HFGS Audition - Completed</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen flex flex-col justify-between p-6 sm:p-10 font-sans relative">

  <!-- Top Navigation -->
  <header class="w-full max-w-6xl mx-auto flex items-center justify-between">
    <a href="#" class="inline-flex items-center text-gray-300 hover:text-white transition-colors text-sm font-medium gap-2">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      <span>Back to Home</span>
    </a>

    <!-- View Leaderboard Top Button -->
    <button class="inline-flex items-center gap-2 bg-[#1A120B] border border-[#3D2514] text-[#E08535] hover:bg-[#25190F] hover:text-[#F59E0B] px-4 py-2 rounded-full text-xs sm:text-sm font-medium transition-all">
      <i data-lucide="shield" class="w-4 h-4 text-[#E08535]"></i>
      <span>View Leaderboard</span>
    </button>
  </header>

  <!-- Main Content (Completion Modal Card) -->
  <main class="flex-1 flex items-center justify-center py-8">
    <div class="w-full max-w-[480px] bg-[#120B06] border border-[#2A1D13] rounded-3xl p-6 sm:p-10 flex flex-col items-center text-center shadow-2xl relative">
      
      <!-- Close Button -->
      <button 
        onclick="closeModal()" 
        class="absolute top-6 right-6 text-gray-400 hover:text-white transition-colors p-1"
        aria-label="Close modal"
      >
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <!-- Success Badge Icon -->
      <div class="w-16 h-16 rounded-full bg-[#3D1D09] border border-[#7C3A10] flex items-center justify-center mb-6 shadow-inner">
        <i data-lucide="check" class="w-8 h-8 text-[#F59E0B]"></i>
      </div>

      <!-- Main Title -->
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-2">
        Audition Completed!
      </h1>

      <!-- Description -->
      <p class="text-gray-400 text-xs sm:text-sm font-normal mb-6 max-w-xs leading-relaxed">
        Your responses have been submitted and your performance is below.
      </p>

      <!-- Stats Summary Card -->
      <div class="w-full bg-[#18100A] border border-[#2D1F14] rounded-2xl p-4 sm:p-5 mb-6 flex flex-col gap-3.5 text-xs sm:text-sm">
        
        <!-- Metric 1: Completion Time -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5 text-gray-300">
            <i data-lucide="clock" class="w-4 h-4 text-[#F59E0B]"></i>
            <span>Completion Time</span>
          </div>
          <span class="font-semibold text-white">4m 2s</span>
        </div>

        <!-- Metric 2: Score -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5 text-gray-300">
            <i data-lucide="shield" class="w-4 h-4 text-[#F59E0B]"></i>
            <span>Score</span>
          </div>
          <span class="font-semibold text-[#F59E0B]">1 / 10 points</span>
        </div>

        <!-- Metric 3: Position -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5 text-gray-300">
            <i data-lucide="check-circle-2" class="w-4 h-4 text-[#F59E0B]"></i>
            <span>Position</span>
          </div>
          <span class="font-semibold text-white">9th</span>
        </div>

      </div>

      <!-- Action Buttons -->
      <div class="w-full flex flex-col gap-3">
        <!-- View Leaderboard Button -->
        <button 
          onclick="viewLeaderboard()" 
          class="w-full bg-transparent border border-[#3D2514] hover:border-[#D97706]/60 text-white font-medium py-3.5 px-6 rounded-full transition-all duration-200 text-sm active:scale-[0.99]"
        >
          View Leaderboard
        </button>

        <!-- Play Again Button -->
        <button 
          onclick="playAgain()" 
          class="w-full bg-[#52250A] hover:bg-[#682E0B] text-[#F3EBE6] border border-[#7C3A10]/50 font-medium py-3.5 px-6 rounded-full transition-all duration-200 text-sm shadow-lg hover:shadow-[#52250A]/20 active:scale-[0.99]"
        >
          Play Again
        </button>
      </div>

    </div>
  </main>

  <!-- Empty Footer placeholder for vertical centering -->
  <footer class="w-full max-w-6xl mx-auto opacity-0 pointer-events-none">
    <span class="text-xs">Footer</span>
  </footer>

  <!-- JavaScript -->
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    function closeModal() {
      console.log('Modal closed');
    }

    function viewLeaderboard() {
      console.log('Navigating to Leaderboard...');
    }

    function playAgain() {
      console.log('Restarting Audition...');
    }
  </script>
</body>
</html>
