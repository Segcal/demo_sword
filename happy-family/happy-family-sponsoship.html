<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsorship Form</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#050505}
.page-backdrop{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 15% 20%,rgba(249,115,22,.16),transparent 30%),radial-gradient(circle at 85% 75%,rgba(245,158,11,.11),transparent 32%),rgba(0,0,0,.48);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);pointer-events:none}
.background-content{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),radial-gradient(circle at 50% 10%,#292929 0%,#0b0b0b 45%,#020202 100%)}
.background-content:before{content:"";position:absolute;width:420px;height:420px;left:-120px;top:15%;border-radius:9999px;background:rgba(249,115,22,.13);filter:blur(90px)}
.background-content:after{content:"";position:absolute;width:500px;height:500px;right:-150px;bottom:-100px;border-radius:9999px;background:rgba(245,158,11,.09);filter:blur(100px)}
.form-card{box-shadow:0 35px 90px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.07)}
.success-modal{animation:modalIn .22s ease-out}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
</style>
</head>
<body class="min-h-screen text-gray-800">
<div class="background-content"></div>
<div class="page-backdrop"></div>

<main class="relative z-10 min-h-screen flex items-center justify-center p-4 sm:p-6">
  <div class="form-card bg-white w-full max-w-xl rounded-3xl p-6 sm:p-10 relative">
    <button type="button" onclick="goBack()" class="inline-flex items-center gap-1.5 text-xs font-semibold text-orange-400 border border-orange-200 bg-orange-50/40 hover:bg-orange-100 px-4 py-1.5 rounded-full transition-colors mb-6">← Return</button>

    <div class="mb-6">
      <h2 class="text-2xl font-bold text-orange-400 tracking-tight">Fill form</h2>
      <p class="text-xs text-gray-500 font-medium mt-2">Kindly fill the below form to proceed with your donation.</p>
    </div>

    <form id="sponsorshipForm" class="space-y-5">
      <div>
        <label for="fullName" class="block text-xs font-semibold text-gray-700 mb-1.5">Full name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required class="w-full px-4 py-3 text-xs bg-gray-50/50 text-gray-800 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none placeholder:text-gray-400 transition">
      </div>
      <div>
        <label for="emailAddress" class="block text-xs font-semibold text-gray-700 mb-1.5">Email Address</label>
        <input type="email" id="emailAddress" placeholder="Enter your email address" required class="w-full px-4 py-3 text-xs bg-gray-50/50 text-gray-800 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none placeholder:text-gray-400 transition">
      </div>
      <div>
        <label for="phoneNumber" class="block text-xs font-semibold text-gray-700 mb-1.5">Phone Number</label>
        <input type="tel" id="phoneNumber" placeholder="Enter your phone number" required class="w-full px-4 py-3 text-xs bg-gray-50/50 text-gray-800 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none placeholder:text-gray-400 transition">
      </div>

      <div class="flex items-center justify-between pt-6 mt-8 gap-3">
        <button type="button" onclick="goBack()" class="px-8 py-2.5 border border-orange-300 hover:bg-orange-50 text-orange-400 text-xs font-medium rounded-full transition-colors">Previous</button>
        <button type="submit" class="px-9 py-2.5 bg-orange-400 hover:bg-orange-500 text-white text-xs font-semibold rounded-full shadow-md shadow-orange-400/20 transition-colors">Submit</button>
      </div>
    </form>
  </div>
</main>

<div id="successModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
  <div class="success-modal bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 sm:p-8 relative text-center">
    <button type="button" onclick="hideModal()" class="absolute top-4 right-4 text-gray-800 hover:text-gray-500 p-1" aria-label="Close modal">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <div class="mt-2 space-y-3">
      <h3 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight">Sponsorship Interest Received!</h3>
      <p class="text-xs text-gray-600 leading-relaxed px-2">Thank you for your interest in sponsoring our program. We have received your message and our team will reach out shortly.</p>
    </div>
    <div class="mt-6">
      <button type="button" onclick="hideModal()" class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white text-xs font-semibold rounded-full shadow-md shadow-orange-500/20 transition-colors">Return to Home</button>
    </div>
  </div>
</div>

<script>
const form=document.getElementById("sponsorshipForm");
const modal=document.getElementById("successModal");
form.addEventListener("submit",e=>{
  e.preventDefault();
  if(!form.checkValidity()){form.reportValidity();return}
  modal.classList.remove("hidden");
  document.body.classList.add("overflow-hidden");
});
function hideModal(){modal.classList.add("hidden");document.body.classList.remove("overflow-hidden")}
function goBack(){if(history.length>1) history.back(); else location.href="./index.html"}
modal.addEventListener("click",e=>{if(e.target===modal)hideModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.classList.contains("hidden"))hideModal()});
</script>
</body>
</html>
